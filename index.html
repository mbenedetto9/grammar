<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Practice - Student View</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      max-width: 600px;
    }
    .word {
      display: inline-block;
      padding: 4px;
      margin: 1px;
      cursor: pointer;
    }
    .selected {
      background-color: #ffeb3b;
    }
    .sentence {
      font-size: 1.25em;
      margin: 20px 0;
    }
    #feedback {
      margin-top: 15px;
      font-weight: bold;
    }
    button {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Grammar Practice</h1>
  <label for="topicSelect">Choose a topic:</label>
  <select id="topicSelect"></select>

  <div id="sentenceContainer" class="sentence"></div>
  <button id="checkBtn">Check Answer</button>
  <div id="feedback"></div>
  <button id="nextBtn" style="display:none;">Next Question</button>

  <script>
    const questionBank = {
      "Pronouns": [
        {
          text: "Everyone should bring their own pencil.",
          incorrectIndex: 4
        }
      ],
      "Punctuation": [
        {
          text: "I need milk eggs and bread.",
          incorrectIndex: 3
        }
      ],
      "Subject-Verb Agreement": [
        {
          text: "Neither the teacher nor the students was ready for the test.",
          incorrectIndex: 7
        }
      ]
    };

    let currentTopic = "";
    let currentIndex = 0;

    const topicSelect = document.getElementById("topicSelect");
    const sentenceContainer = document.getElementById("sentenceContainer");
    const feedbackDiv = document.getElementById("feedback");
    const checkBtn = document.getElementById("checkBtn");
    const nextBtn = document.getElementById("nextBtn");

    Object.keys(questionBank).forEach(topic => {
      const option = document.createElement("option");
      option.value = topic;
      option.textContent = topic;
      topicSelect.appendChild(option);
    });

    topicSelect.addEventListener("change", () => {
      currentTopic = topicSelect.value;
      currentIndex = 0;
      loadQuestion();
    });

    function tokenize(sentence) {
      return sentence.match(/\w+('\w+)?|[.,!?;:"]+/g);
    }

    function loadQuestion() {
      feedbackDiv.textContent = "";
      nextBtn.style.display = "none";
      sentenceContainer.innerHTML = "";

      const question = questionBank[currentTopic][currentIndex];
      const tokens = tokenize(question.text);

      tokens.forEach((token, idx) => {
        const span = document.createElement("span");
        span.textContent = token;
        span.className = "word";
        span.dataset.index = idx;
        span.addEventListener("click", () => {
          document.querySelectorAll(".word").forEach(w => w.classList.remove("selected"));
          span.classList.add("selected");
        });
        sentenceContainer.appendChild(span);
        sentenceContainer.append(" ");
      });
    }

    checkBtn.addEventListener("click", () => {
      const selected = document.querySelector(".word.selected");
      if (!selected) {
        feedbackDiv.textContent = "Please select a word or punctuation mark.";
        return;
      }

      const selectedIndex = parseInt(selected.dataset.index);
      const correctIndex = questionBank[currentTopic][currentIndex].incorrectIndex;

      if (selectedIndex === correctIndex) {
        feedbackDiv.textContent = "✅ Correct!";
        feedbackDiv.style.color = "green";
        nextBtn.style.display = "inline-block";
      } else {
        feedbackDiv.textContent = "❌ Try again.";
        feedbackDiv.style.color = "red";
      }
    });

    nextBtn.addEventListener("click", () => {
      currentIndex++;
      const questions = questionBank[currentTopic];
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        sentenceContainer.innerHTML = "🎉 You've completed all questions in this topic!";
        checkBtn.style.display = "none";
        nextBtn.style.display = "none";
        feedbackDiv.textContent = "";
      }
    });

    // Initialize first topic
    currentTopic = topicSelect.value = Object.keys(questionBank)[0];
    loadQuestion();
  </script>
</body>
</html>
